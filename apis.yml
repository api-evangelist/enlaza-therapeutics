aid: enlaza-therapeutics
name: Enlaza Therapeutics
description: Enlaza Therapeutics is a clinical-stage biopharmaceutical company in La Jolla,
  California developing first-in-class covalent protein biologics for cancer and other serious
  diseases. Its proprietary War-Lock technology uses engineered unnatural amino acids to enable
  protein drugs — including antibody-drug conjugates and T-cell engagers — to bind their disease
  targets irreversibly, aiming for sustained target occupancy and a prolonged biologic effect with
  minimal systemic exposure across oncology and immuno-oncology applications. The company was
  surfaced as a portfolio company of Lightspeed Venture Partners and added to the API Evangelist
  network; it publishes a corporate website but no public developer API surface.
